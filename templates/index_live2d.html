<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StyleBot - AI Fashion Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100 h-screen flex flex-col">

    <header class="bg-indigo-600 text-white p-4 shadow-lg flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="bg-white p-2 rounded-full text-indigo-600">
                <i class="fas fa-tshirt fa-lg"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold">StyleBot</h1>
                <p class="text-xs opacity-80">Asisten Outfit Pribadi Anda</p>
            </div>
        </div>
    </header>

    <main id="chat-window" class="flex-1 overflow-y-auto p-4 space-y-4 bg-slate-50">
        <div class="flex justify-start">
            <div class="bg-white border border-gray-200 text-gray-800 p-3 rounded-2xl rounded-tl-none max-w-[80%] shadow-sm">
                Halo! Saya StyleBot. Butuh saran outfit untuk acara apa hari ini? 👗👔
            </div>
        </div>
    </main>

    <footer class="bg-white p-4 border-t border-gray-200">
        <div class="max-w-4xl mx-auto flex items-center space-x-2">
            <input type="text" id="user-input" 
                   class="flex-1 border border-gray-300 rounded-full px-4 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" 
                   placeholder="Tanya soal outfit..."
                   onkeypress="if(event.key === 'Enter') sendMessage()">
            <button onclick="sendMessage()" 
                    class="bg-indigo-600 text-white p-3 rounded-full hover:bg-indigo-700 transition shadow-md">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </footer>

    <script>
        async function sendMessage() {
            const input = document.getElementById("user-input");
            const chatWindow = document.getElementById("chat-window");
            const message = input.value.trim();
            
            if (!message) return;

            // Tampilkan Pesan User
            const userHtml = `
                <div class="flex justify-end">
                    <div class="bg-indigo-600 text-white p-3 rounded-2xl rounded-tr-none max-w-[80%] shadow-md">
                        ${message}
                    </div>
                </div>`;
            chatWindow.innerHTML += userHtml;
            input.value = "";
            chatWindow.scrollTop = chatWindow.scrollHeight;

            // Tampilkan Loading (Opsional)
            const loadingId = "loading-" + Date.now();
            chatWindow.innerHTML += `
                <div id="${loadingId}" class="flex justify-start">
                    <div class="bg-gray-200 text-gray-500 p-3 rounded-2xl animate-pulse">
                        StyleBot sedang berpikir...
                    </div>
                </div>`;
            chatWindow.scrollTop = chatWindow.scrollHeight;

            try {
                const response = await fetch("/get_response", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: message })
                });
                const data = await response.json();

                // Hapus Loading
                document.getElementById(loadingId).remove();

                // Tampilkan Respons Bot
                const botHtml = `
                    <div class="flex justify-start">
                        <div class="bg-white border border-gray-200 text-gray-800 p-3 rounded-2xl rounded-tl-none max-w-[80%] shadow-sm whitespace-pre-line">
                            ${data.response}
                        </div>
                    </div>`;
                chatWindow.innerHTML += botHtml;
            } catch (error) {
                document.getElementById(loadingId).innerText = "Maaf, terjadi kesalahan.";
            }
            
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }
    </script>
</body>
</html>
